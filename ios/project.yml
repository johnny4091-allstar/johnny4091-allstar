# The Aurora iPhone app. The Xcode project is generated from this file with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd ios && xcodegen generate
# The Aurora screens in ../aurora are bundled into the app, like the Android app does.
name: Aurora
options:
  bundleIdPrefix: com.johnny4091
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.johnny4091.aurora
    DEVELOPMENT_TEAM: ""                  # the build workflow passes the real Team ID
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: Aurora
        excludes:
          - Info.plist
    resources:
      - path: ../aurora
        type: folder
        buildPhase: resources
    info:
      path: Aurora/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # TV providers stream over plain http, and the server may be reached by address: both need this.
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
