<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Splash styles are inline so it shows on the very first frame. -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 10000; background: #070c1c; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; transition: opacity .55s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash .glow { position: absolute; width: 90vmax; height: 50vmax; border-radius: 50%; filter: blur(70px); opacity: 0; animation: splash-glow 2.4s ease-out forwards, splash-drift 9s ease-in-out 2.4s infinite alternate; }
    #splash .g1 { background: radial-gradient(closest-side, rgba(42,212,208,.55), transparent); left: -30vmax; top: 10vh; }
    #splash .g2 { background: radial-gradient(closest-side, rgba(122,92,255,.5), transparent); right: -35vmax; top: 30vh; animation-delay: .25s, 2.6s; }
    #splash .mark { width: min(26vmin, 170px); height: auto; overflow: visible; }
    #splash .streak { stroke-dasharray: 60; stroke-dashoffset: 60; animation: splash-draw .9s cubic-bezier(.6,0,.2,1) .15s forwards; }
    #splash .a { stroke-dasharray: 75; stroke-dashoffset: 75; animation: splash-draw .8s cubic-bezier(.6,0,.2,1) .45s forwards; }
    #splash .word { width: min(62vw, 420px); height: auto; margin-top: min(5vmin, 34px); opacity: 0; transform: translateY(8px); animation: splash-rise .7s ease-out .9s forwards; }
    #splash .loading { position: absolute; bottom: 12vh; width: 140px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; opacity: 0; animation: splash-rise .4s ease-out 1.9s forwards; }
    #splash .loading span { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, #18b6d6, #4f7bff, #7a5cff); animation: splash-load 1.1s ease-in-out infinite; }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-rise { to { opacity: 1; transform: none; } }
    @keyframes splash-glow { to { opacity: 1; } }
    @keyframes splash-drift { to { transform: translate(6vmax, -4vmax) scale(1.08); } }
    @keyframes splash-load { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash .glow { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <!-- Splash: shown while Aurora starts and loads; app.js fades it out. -->
  <div id="splash" aria-label="Aurora is loading" role="img">
    <div class="glow g1"></div><div class="glow g2"></div>
    <svg class="mark" viewBox="24 20 62 64" fill="none" aria-hidden="true">
      <defs><linearGradient id="splash-grad" x1="29" y1="40" x2="81" y2="33" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2AD4D0"/><stop offset=".55" stop-color="#4F7BFF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs>
      <path class="streak" d="M29,40 C40,25 63,22 81,33" stroke="url(#splash-grad)" stroke-width="3.5" stroke-linecap="round"/>
      <path class="a" d="M38,79 L54,47 L70,79" stroke="#fff" stroke-width="6" stroke-miterlimit="10"/>
    </svg>
    <svg class="word" xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 776 112" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" aria-hidden="true"><path d="M7.0 100 L51.0 15.4 L95.0 100 M155.0 0 V57.0 A36 36 0 0 0 227.0 57.0 V0 M287.0 100 V7.0 H317.0 A24.5 24.5 0 0 1 317.0 56.0 H287.0 M319.0 56.0 L351.0 100 M411.0 50 A43.0 43.0 0 1 0 497.0 50 A43.0 43.0 0 1 0 411.0 50 Z M557.0 100 V7.0 H587.0 A24.5 24.5 0 0 1 587.0 56.0 H557.0 M589.0 56.0 L621.0 100 M681.0 100 L725.0 15.4 L769.0 100"/></svg>
    <div class="loading"><span></span></div>
  </div>
  <!-- Connect screen -->
  <section id="setup" class="screen hidden">
    <div class="setup-card">
      <div class="logo big"><svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 776 112" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" role="img" aria-label="Aurora"><path d="M7.0 100 L51.0 15.4 L95.0 100 M155.0 0 V57.0 A36 36 0 0 0 227.0 57.0 V0 M287.0 100 V7.0 H317.0 A24.5 24.5 0 0 1 317.0 56.0 H287.0 M319.0 56.0 L351.0 100 M411.0 50 A43.0 43.0 0 1 0 497.0 50 A43.0 43.0 0 1 0 411.0 50 Z M557.0 100 V7.0 H587.0 A24.5 24.5 0 0 1 587.0 56.0 H557.0 M589.0 56.0 L621.0 100 M681.0 100 L725.0 15.4 L769.0 100"/></svg></div>
      <h1 id="setup-title">Sign In</h1>
      <div id="account-tiles" class="account-tiles hidden"></div>
      <h2 id="setup-form-title" class="setup-subtitle hidden">Sign in as someone else</h2>
      <form id="setup-form">
        <label>Username
          <input id="setup-username" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false">
        </label>
        <label>Password
          <input id="setup-password" type="password" autocomplete="current-password">
        </label>
        <p id="setup-error" class="error hidden"></p>
        <button class="btn btn-red btn-block" type="submit">Sign In</button>
      </form>
      <p class="hint">Sign in using the same username and password you created when you set up your account. Your sign-in details are stored only on this device.</p>
    </div>
  </section>

  <!-- Main app -->
  <div id="main" class="hidden">
    <header id="nav">
      <a href="#/home" class="logo" tabindex="-1" aria-label="Aurora home"><svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 776 112" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" role="img" aria-label="Aurora"><path d="M7.0 100 L51.0 15.4 L95.0 100 M155.0 0 V57.0 A36 36 0 0 0 227.0 57.0 V0 M287.0 100 V7.0 H317.0 A24.5 24.5 0 0 1 317.0 56.0 H287.0 M319.0 56.0 L351.0 100 M411.0 50 A43.0 43.0 0 1 0 497.0 50 A43.0 43.0 0 1 0 411.0 50 Z M557.0 100 V7.0 H587.0 A24.5 24.5 0 0 1 587.0 56.0 H557.0 M589.0 56.0 L621.0 100 M681.0 100 L725.0 15.4 L769.0 100"/></svg></a>
      <nav class="nav-links">
        <a href="#/home" data-route="home">Home</a>
        <a href="#/tv" data-route="tv">TV Shows</a>
        <a href="#/movies" data-route="movies">Movies</a>
        <a href="#/mylist" data-route="mylist">My List</a>
        <a href="#/livetv" data-route="livetv" class="hidden">Live TV</a>
        <a href="#/requests" data-route="requests" class="hidden">Requests</a>
      </nav>
      <div class="nav-right">
        <div id="search-box" class="search-box">
          <button id="search-toggle" class="icon-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
          </button>
          <input id="search-input" type="search" placeholder="Movies, shows, actors">
        </div>
        <div class="profile-menu">
          <button id="profile-btn" class="avatar-btn" aria-label="Profile menu"></button>
          <div id="profile-dropdown" class="dropdown hidden">
            <button data-action="settings">Settings</button>
            <button data-action="admin" class="hidden">Admin</button>
            <button data-action="switch">Switch user</button>
            <button data-action="signout">Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <main id="page"></main>
    <nav class="mobile-tabs">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/tv" data-route="tv">TV Shows</a>
      <a href="#/movies" data-route="movies">Movies</a>
      <a href="#/mylist" data-route="mylist">My List</a>
      <a href="#/livetv" data-route="livetv" class="hidden">Live TV</a>
      <a href="#/requests" data-route="requests" class="hidden">Requests</a>
    </nav>
  </div>

  <!-- Details modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <button class="modal-close icon-btn" data-close aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Video player -->
  <div id="player" class="player hidden">
    <video id="video" playsinline></video>
    <div class="player-top">
      <button id="player-back" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
      </button>
      <div id="player-title" class="player-title"></div>
    </div>
    <div id="player-status" class="player-status hidden"></div>
    <button id="skip-intro" class="btn btn-white skip-intro hidden">Skip Intro</button>
    <div class="player-osd">
      <div class="osd-seek-row">
        <input id="osd-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
        <span id="osd-remaining" class="osd-time"></span>
      </div>
      <div class="osd-buttons">
        <button id="osd-play" class="osd-btn" data-autofocus aria-label="Play"></button>
        <button id="osd-back10" class="osd-btn" aria-label="Back 10 seconds"></button>
        <button id="osd-fwd10" class="osd-btn" aria-label="Forward 10 seconds"></button>
        <button id="osd-mute" class="osd-btn" aria-label="Mute"></button>
        <span class="live-badge osd-live">LIVE</span>
        <span id="osd-time" class="osd-time"></span>
        <span class="osd-spacer"></span>
        <button id="player-next" class="osd-btn osd-text hidden">Next Episode</button>
        <button id="osd-tracks" class="osd-btn osd-text osd-settings" aria-label="Playback settings: language, subtitles, speed and resolution"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg><span>Settings</span></button>
        <button id="osd-fullscreen" class="osd-btn" aria-label="Full screen">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M5 5h5v2H7v3H5V5Zm9 0h5v5h-2V7h-3V5ZM5 14h2v3h3v2H5v-5Zm12 3v-3h2v5h-5v-2h3Z"/></svg>
        </button>
      </div>
    </div>
    <div id="tracks-panel" class="tracks-panel hidden"></div>
    <div id="up-next" class="up-next hidden"></div>
    <div id="still-watching" class="still-watching hidden"></div>
  </div>

  <!-- YouTube trailer window (used when the YouTube app isn't available) -->
  <div id="trailer" class="trailer hidden" role="dialog" aria-modal="true"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
