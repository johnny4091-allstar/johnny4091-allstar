<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmbyFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Optional local config (gitignored). Copy config.example.js to config.js to prefill your server. -->
  <script src="config.js"></script>
</head>
<body>
  <!-- Connect screen -->
  <section id="setup" class="screen hidden">
    <div class="setup-card">
      <div class="logo big">EMBYFLIX</div>
      <h1>Connect to your Emby server</h1>
      <form id="setup-form" autocomplete="off">
        <label>Server address
          <input id="setup-server" type="text" placeholder="http://192.168.1.10:8096" required>
        </label>
        <label>API key
          <input id="setup-key" type="password" placeholder="Emby API key" required>
        </label>
        <p id="setup-warning" class="warning hidden"></p>
        <p id="setup-error" class="error hidden"></p>
        <button class="btn btn-red btn-block" type="submit">Connect</button>
      </form>
      <p class="hint">Create an API key in Emby: Settings &rarr; Advanced &rarr; API Keys. Your details are stored only in this browser.</p>
    </div>
  </section>

  <!-- Who's watching -->
  <section id="profiles" class="screen hidden">
    <h1 class="profiles-title">Who's watching?</h1>
    <div id="profile-list" class="profile-list"></div>
    <button id="profiles-settings" class="btn btn-outline">Change server</button>
  </section>

  <!-- Main app -->
  <div id="main" class="hidden">
    <header id="nav">
      <a href="#/home" class="logo">EMBYFLIX</a>
      <nav class="nav-links">
        <a href="#/home" data-route="home">Home</a>
        <a href="#/tv" data-route="tv">TV Shows</a>
        <a href="#/movies" data-route="movies">Movies</a>
        <a href="#/mylist" data-route="mylist">My List</a>
      </nav>
      <div class="nav-right">
        <div id="search-box" class="search-box">
          <button id="search-toggle" class="icon-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
          </button>
          <input id="search-input" type="search" placeholder="Titles, people, genres">
        </div>
        <div class="profile-menu">
          <button id="profile-btn" class="avatar-btn" aria-label="Profile menu"></button>
          <div id="profile-dropdown" class="dropdown hidden">
            <button data-action="switch">Switch profile</button>
            <button data-action="settings">Change server</button>
          </div>
        </div>
      </div>
    </header>
    <main id="page"></main>
    <nav class="mobile-tabs">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/tv" data-route="tv">TV Shows</a>
      <a href="#/movies" data-route="movies">Movies</a>
      <a href="#/mylist" data-route="mylist">My List</a>
    </nav>
  </div>

  <!-- Details modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <button class="modal-close icon-btn" data-close aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Video player -->
  <div id="player" class="player hidden">
    <video id="video" controls playsinline></video>
    <div class="player-top">
      <button id="player-back" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
      </button>
      <div id="player-title" class="player-title"></div>
      <button id="player-next" class="btn btn-white hidden">Next Episode &#9654;</button>
    </div>
    <div id="player-status" class="player-status hidden"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
