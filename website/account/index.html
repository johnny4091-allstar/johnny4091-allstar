<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Aurora Account</title>
<meta name="theme-color" content="#070c1c">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script src="../config.js"></script>
<style>
@font-face { font-family:'Inter'; src:url('../assets/fonts/inter-variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
:root { --bg:#070c1c; --bg-2:#0e1530; --text:#fff; --muted:#b3b3b3; --dim:#808080; --line:#232f58; --accent:#2ad4d0; --red:#ff8d9b; --green:#46d369; --amber:#ffd479;
  --grad:linear-gradient(100deg,#18b6d6 0%,#4f7bff 55%,#7a5cff 100%); --font:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 var(--font); -webkit-font-smoothing:antialiased; background-image:radial-gradient(60% 30% at 8% 0%,rgba(42,212,208,.14),transparent 70%),radial-gradient(50% 30% at 100% 0%,rgba(122,92,255,.2),transparent 70%); background-repeat:no-repeat; }
.wrap { max-width:680px; margin:0 auto; padding:0 max(16px,env(safe-area-inset-left,0px)) 80px; }
.bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 0; }
.pill { display:inline-flex; align-items:center; gap:.9rem; padding:.45rem 1.1rem; border-radius:999px; background:rgba(12,19,44,.76); border:1px solid rgba(255,255,255,.09); }
.pill svg { height:20px; width:auto; display:block; } .pill span { font-size:.8rem; color:#cfd6f5; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
h1 { font-size:clamp(1.6rem,5vw,2.1rem); line-height:1.15; margin:10px 0 6px; font-weight:800; text-wrap:balance; }
h2 { font-size:1.1rem; margin:0 0 4px; font-weight:800; }
.lead { color:var(--muted); margin:0 0 20px; }
.card { background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
label.f { display:block; font-size:.8rem; font-weight:700; color:#e5e5e5; margin:0 0 6px; }
.txt, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0a1126; color:#fff; font:inherit; }
.btn { border:0; border-radius:10px; padding:13px 18px; font:800 .95rem var(--font); color:#fff; background:var(--grad); cursor:pointer; text-shadow:0 1px 2px rgba(0,0,0,.35); }
.btn.block { width:100%; } .btn:disabled { opacity:.6; cursor:default; }
.btn.line { background:none; border:1px solid var(--line); text-shadow:none; color:#e5e5e5; padding:8px 14px; font-size:.85rem; }
.btn.line.danger { color:var(--red); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.err { color:var(--red); margin-top:12px; font-size:.92rem; } .ok { color:var(--green); margin-top:12px; font-size:.92rem; }
.hint { color:var(--dim); font-size:.82rem; margin:10px 0 0; }
.big { display:flex; flex-wrap:wrap; gap:14px 28px; align-items:flex-end; }
.stat small { display:block; color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.stat b { font-size:1.6rem; font-weight:800; font-variant-numeric:tabular-nums; }
.tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; vertical-align:middle; margin-left:8px; }
.tag.on { background:rgba(70,211,105,.15); color:var(--green); } .tag.soon { background:rgba(255,212,121,.14); color:var(--amber); } .tag.exp { background:rgba(255,141,155,.14); color:var(--red); }
.bar2 { height:8px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; margin:14px 0 4px; } .bar2 i { display:block; height:100%; background:var(--grad); border-radius:99px; }
.dev { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .dev:first-of-type { border-top:0; }
.dev .nm { font-weight:700; overflow-wrap:anywhere; } .dev .meta { color:var(--muted); font-size:.84rem; }
.dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--green); }
.note { padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0a1126; margin:0 0 12px; font-size:.92rem; }
.note.good { border-color:#2f7a4a; } .note.bad { border-color:#8a3b48; }
.contact { display:grid; gap:6px; } .contact a { color:var(--accent); }
.empty { color:var(--muted); padding:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="pill"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 776 112" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" role="img" aria-label="Aurora"><path d="M7.0 100 L51.0 15.4 L95.0 100 M155.0 0 V57.0 A36 36 0 0 0 227.0 57.0 V0 M287.0 100 V7.0 H317.0 A24.5 24.5 0 0 1 317.0 56.0 H287.0 M319.0 56.0 L351.0 100 M411.0 50 A43.0 43.0 0 1 0 497.0 50 A43.0 43.0 0 1 0 411.0 50 Z M557.0 100 V7.0 H587.0 A24.5 24.5 0 0 1 587.0 56.0 H557.0 M589.0 56.0 L621.0 100 M681.0 100 L725.0 15.4 L769.0 100"/></svg><span>My account</span></div>
    <button class="btn line" id="out" type="button" hidden>Sign out</button>
  </div>

  <section id="login">
    <h1>Your Aurora account</h1>
    <p class="lead">Sign in with your Aurora username and password to see when your access ends, which devices are signed in, and to ask for more time.</p>
    <div class="card">
      <label class="f" for="lu">Username</label><input class="txt" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label class="f" for="lp" style="margin-top:12px">Password</label><input class="txt" id="lp" type="password" autocomplete="current-password">
      <button class="btn block" id="go" type="button" style="margin-top:16px">Sign in</button>
      <p class="err" id="lerr" role="alert" hidden></p>
    </div>
  </section>

  <section id="app" hidden>
    <h1 id="hello">Hello</h1>
    <p class="lead" id="sub"></p>

    <div class="card" id="status"></div>

    <div class="card">
      <h2>Your devices</h2>
      <p class="hint" style="margin:0 0 6px" id="devhint"></p>
      <div id="devs"><div class="empty">Loading...</div></div>
      <p class="err" id="devmsg" role="status" hidden></p>
    </div>

    <div class="card" id="renew" hidden>
      <h2>Need more time?</h2>
      <div id="renewnote"></div>
      <div id="renewform" hidden>
        <label class="f" for="plan" style="margin-top:8px">What would you like?</label>
        <select id="plan"></select>
        <label class="f" for="note" style="margin-top:12px">A note (optional)</label>
        <input class="txt" id="note" maxlength="200" placeholder="Anything you want us to know">
        <button class="btn block" id="ask" type="button" style="margin-top:14px">Request an extension</button>
      </div>
      <p class="ok" id="renewok" role="status" hidden></p><p class="err" id="renewerr" role="alert" hidden></p>
    </div>

    <div class="card" id="helpcard" hidden>
      <h2>Need help?</h2>
      <div class="contact" id="help"></div>
    </div>
  </section>
</div>

<script>
(function () {
  var C = window.AURORA_SITE || {}, G = String(C.guardUrl || '').replace(/\/+$/, '');
  var $ = function (i) { return document.getElementById(i); };
  var session = null, acct = null;
  try { session = JSON.parse(sessionStorage.getItem('aurora.account') || 'null'); } catch (e) { session = null; }
  function keep() { try { if (session) sessionStorage.setItem('aurora.account', JSON.stringify(session)); else sessionStorage.removeItem('aurora.account'); } catch (e) { /* private window */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
  function ago(iso) {
    var t = Date.parse(iso); if (!t) return 'a while ago';
    var m = Math.round((Date.now() - t) / 60000);
    return m < 2 ? 'just now' : m < 60 ? m + ' minutes ago' : m < 1440 ? Math.round(m / 60) + ' hours ago' : Math.round(m / 1440) + ' days ago';
  }
  function api(method, path, body) {
    var h = {}; if (body) h['Content-Type'] = 'application/json';
    if (session) h['X-Emby-Token'] = session.token;
    var q = (path.indexOf('?') >= 0 ? '&' : '?') + 'userId=' + encodeURIComponent(session ? session.userId : '') + '&by=' + encodeURIComponent(session ? session.name : '');
    return fetch(G + path + q, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.__status = r.status; return j; }); });
  }
  function show(inn) { $('login').hidden = inn; $('app').hidden = !inn; $('out').hidden = !inn; }
  function out(text) { session = null; acct = null; keep(); show(false); if (text) { $('lerr').hidden = false; $('lerr').textContent = text; } }
  function say(id, text) { var el = $(id); el.hidden = !text; el.textContent = text || ''; }

  function paintStatus() {
    var a = acct, n = a.limit || 1;
    var cls = a.expired ? 'exp' : (a.daysLeft != null && a.daysLeft <= 7) ? 'soon' : 'on';
    var word = a.expired ? 'Ended' : cls === 'soon' ? 'Ending soon' : 'Active';
    var left = a.expires ? (a.expired ? 'Ended ' + fmt(a.expires) : a.daysLeft <= 0 ? 'Ends today' : a.daysLeft === 1 ? '1 day left' : a.daysLeft + ' days left') : 'No end date';
    var pct = a.expires && a.plan && a.plan.length && !a.expired ? Math.max(3, Math.min(100, Math.round(a.daysLeft / (a.plan.unit === 'month' ? a.plan.length * 30 : a.plan.unit === 'year' ? a.plan.length * 365 : a.plan.unit === 'week' ? a.plan.length * 7 : a.plan.length) * 100))) : (a.expired ? 0 : 100);
    $('status').innerHTML = '<h2>Your plan <span class="tag ' + cls + '">' + word + '</span></h2>' +
      '<div class="big" style="margin-top:12px"><div class="stat"><small>Plan</small><b>' + esc(a.plan ? a.plan.name : 'Aurora') + '</b></div>' +
      '<div class="stat"><small>Access until</small><b>' + esc(a.expires ? fmt(a.expires) : 'No end date') + '</b></div>' +
      '<div class="stat"><small>Devices at once</small><b>' + (a.activeDevices || 0) + ' of ' + n + '</b></div></div>' +
      '<div class="bar2" aria-hidden="true"><i style="width:' + pct + '%"></i></div><div class="hint" style="margin:0">' + esc(left) + (a.disabled ? ' · This account is switched off. Please contact your provider.' : '') + '</div>';
  }
  function paintRenew() {
    var a = acct, r = a.request, note = '';
    $('renew').hidden = !a.expires;
    if (!a.expires) return;
    if (r && r.status === 'pending') note = '<div class="note">Request sent ' + esc(ago(new Date(r.at).toISOString())) + (r.wantedPlan ? ' (' + esc(r.wantedPlan) + ')' : '') + '. ' + (r.to === 'reseller' ? 'Your reseller' : 'The admin') + ' will review it.</div>';
    else if (r && r.status === 'approved' && Date.now() - (r.decidedAt || 0) < 14 * 86400000) note = '<div class="note good">Your extension was approved' + (r.newExpires ? ': access now runs until ' + esc(fmt(r.newExpires)) : '') + '.' + (r.message ? ' ' + esc(r.message) : '') + '</div>';
    else if (r && r.status === 'denied' && Date.now() - (r.decidedAt || 0) < 14 * 86400000) note = '<div class="note bad">Your last request was not approved.' + (r.message ? ' ' + esc(r.message) : ' Please contact your provider.') + '</div>';
    $('renewnote').innerHTML = note;
    $('renewform').hidden = !a.canRequest;
    if (a.canRequest) api('GET', '/plans/public').then(function (j) {
      var plans = j.plans || [];
      $('plan').innerHTML = '<option value="">More time on my current plan</option>' + plans.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + (p.price ? ' · $' + esc(Number(p.price).toFixed(2)) : '') + '</option>'; }).join('');
    });
  }
  function paintHelp() {
    var s = acct.support, rows = [];
    if (s) {
      if (s.name) rows.push('<div><b>' + esc(s.name) + '</b></div>');
      if (s.phone) rows.push('<div>Phone: ' + esc(s.phone) + '</div>');
      if (s.whatsapp) rows.push('<div>WhatsApp: ' + esc(s.whatsapp) + '</div>');
      if (s.email) rows.push('<div>Email: <a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a></div>');
      if (s.note) rows.push('<div class="hint" style="margin:4px 0 0">' + esc(s.note) + '</div>');
    }
    $('helpcard').hidden = !rows.length; $('help').innerHTML = rows.join('');
  }
  function loadDevices() {
    api('GET', '/account/devices').then(function (j) {
      if (j.__status === 404) { $('devs').innerHTML = '<div class="empty">Device details are not available yet. Please try again later.</div>'; return; }
      if (j.__status !== 200) { $('devs').innerHTML = '<div class="empty">' + esc(j.error || 'Could not load your devices.') + '</div>'; return; }
      var list = j.devices || [];
      $('devhint').textContent = list.length ? 'Signing out a device frees its spot. You can sign in again on it any time.' : '';
      $('devs').innerHTML = list.map(function (d) {
        return '<div class="dev" data-id="' + esc(d.id) + '"><div><div class="nm">' + (d.active ? '<span class="dot" title="In use right now"></span>' : '') + esc(d.name) + '</div><div class="meta">' + esc(d.app) + (d.app ? ' · ' : '') + (d.active ? 'In use now' : 'Last used ' + esc(ago(d.last))) + '</div></div><button class="btn line danger" type="button" data-out>Sign out</button></div>';
      }).join('') || '<div class="empty">No devices are signed in.</div>';
    });
  }
  function load() {
    api('GET', '/account').then(function (a) {
      if (a.__status === 401) { out('Please sign in again.'); return; }
      if (a.__status !== 200) { out(a.error || 'Could not load your account.'); return; }
      if (a.admin) { out('Administrator accounts have no plan to show here. Use the Admin page instead.'); return; }
      acct = a; $('hello').textContent = 'Hello, ' + a.name; $('sub').textContent = 'Here is where your Aurora account stands.';
      paintStatus(); paintRenew(); paintHelp(); loadDevices();
    }).catch(function () { out('Could not reach Aurora. Check your connection.'); });
  }
  function login() {
    var u = $('lu').value.trim(), p = $('lp').value, err = $('lerr');
    if (!u || !p) { err.hidden = false; err.textContent = 'Enter your username and password.'; return; }
    if (!G) { err.hidden = false; err.textContent = 'The Guard address is not set in config.js.'; return; }
    var b = $('go'); b.disabled = true; err.hidden = true;
    fetch(G + '/site-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.__status = r.status; return j; }); })
      .then(function (j) {
        b.disabled = false;
        if (j.__status !== 200) { err.hidden = false; err.textContent = j.error || 'Could not sign in.'; return; }
        session = { token: j.token, userId: j.userId, name: j.name }; keep(); $('lp').value = ''; show(true); load();
      }).catch(function () { b.disabled = false; err.hidden = false; err.textContent = 'Could not reach Aurora. Check your connection.'; });
  }
  $('go').onclick = login; $('lp').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('out').onclick = function () { out(''); };
  $('devs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-out]'); if (!b) return;
    var row = b.closest('.dev'); b.disabled = true; say('devmsg', '');
    api('POST', '/account/devices/remove', { deviceId: row.getAttribute('data-id') }).then(function (j) {
      if (j.__status === 200) { loadDevices(); api('GET', '/account').then(function (a) { if (a.__status === 200) { acct = a; paintStatus(); } }); }
      else { b.disabled = false; say('devmsg', j.error || 'That did not work.'); $('devmsg').className = 'err'; }
    });
  });
  $('ask').onclick = function () {
    var b = $('ask'); b.disabled = true; say('renewerr', ''); say('renewok', '');
    api('POST', '/extension', { userId: session.userId, note: $('note').value.trim(), planId: $('plan').value || undefined }).then(function (j) {
      b.disabled = false;
      if (j.__status !== 200) { say('renewerr', j.error || 'Could not send the request.'); return; }
      say('renewok', 'Request sent. You will see the answer here.'); $('note').value = '';
      api('GET', '/account').then(function (a) { if (a.__status === 200) { acct = a; paintRenew(); } });
    });
  };

  if (session) { show(true); load(); } else show(false);
})();
</script>
</body>
</html>
