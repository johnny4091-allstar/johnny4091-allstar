<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aurora Feature Requests</title>
<meta name="theme-color" content="#070c1c">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script src="../config.js"></script>
<style>
@font-face { font-family:'Inter'; src:url('../assets/fonts/inter-variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
:root { --bg:#070c1c; --bg-2:#0e1530; --text:#fff; --muted:#b3b3b3; --dim:#808080; --line:#232f58; --accent:#2ad4d0; --red:#ff8d9b;
  --grad:linear-gradient(100deg,#18b6d6 0%,#4f7bff 55%,#7a5cff 100%); --font:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 var(--font); -webkit-font-smoothing:antialiased; background-image:radial-gradient(60% 30% at 8% 0%,rgba(42,212,208,.14),transparent 70%),radial-gradient(50% 30% at 100% 0%,rgba(122,92,255,.2),transparent 70%); background-repeat:no-repeat; }
.wrap { max-width:640px; margin:0 auto; padding:0 max(16px,env(safe-area-inset-left,0px)) 80px; }
.bar { padding:18px 0; } .pill { display:inline-flex; align-items:center; gap:.9rem; padding:.45rem 1.1rem; border-radius:999px; background:rgba(12,19,44,.76); border:1px solid rgba(255,255,255,.09); }
.pill svg { height:20px; width:auto; display:block; } .pill span { font-size:.8rem; color:#cfd6f5; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
h1 { font-size:clamp(1.6rem,5vw,2.1rem); line-height:1.15; margin:10px 0 8px; font-weight:800; text-wrap:balance; } .lead { color:var(--muted); margin:0 0 20px; }
.card { background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:12px; }
label.f { display:block; font-size:.8rem; font-weight:700; color:#e5e5e5; margin:0 0 6px; } .opt { color:var(--dim); font-weight:400; }
.txt, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0a1126; color:#fff; font:inherit; } textarea { min-height:140px; resize:vertical; }
.txt::placeholder, textarea::placeholder { color:#6d78a6; }
.kinds { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .kinds label { margin:0; cursor:pointer; } .kinds input { position:absolute; opacity:0; pointer-events:none; }
.kinds span { display:block; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#0a1126; color:#dfe4fa; } .kinds small { display:block; color:var(--dim); font-size:.74rem; }
.kinds input:checked + span { background:#fff; color:#0a1126; border-color:#fff; } .kinds input:checked + span small { color:#4a5478; } .kinds input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.btn { width:100%; margin-top:6px; border:0; border-radius:10px; padding:15px; font:800 1rem var(--font); color:#fff; background:var(--grad); cursor:pointer; text-shadow:0 1px 2px rgba(0,0,0,.35); } .btn:disabled { opacity:.55; cursor:default; }
.btn.line { background:none; border:1px solid var(--line); text-shadow:none; color:#e5e5e5; }
.err { color:var(--red); margin-top:12px; font-size:.92rem; } .hint { color:var(--dim); font-size:.82rem; margin:10px 0 0; } .cnt { float:right; color:var(--dim); font-weight:400; font-variant-numeric:tabular-nums; }
.done { text-align:center; padding:48px 8px; } .done .tick { width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:1.8rem; }
.hp { position:absolute; left:-9999px; }
@media (max-width:420px) { .kinds { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="pill"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 776 112" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" role="img" aria-label="Aurora"><path d="M7.0 100 L51.0 15.4 L95.0 100 M155.0 0 V57.0 A36 36 0 0 0 227.0 57.0 V0 M287.0 100 V7.0 H317.0 A24.5 24.5 0 0 1 317.0 56.0 H287.0 M319.0 56.0 L351.0 100 M411.0 50 A43.0 43.0 0 1 0 497.0 50 A43.0 43.0 0 1 0 411.0 50 Z M557.0 100 V7.0 H587.0 A24.5 24.5 0 0 1 587.0 56.0 H557.0 M589.0 56.0 L621.0 100 M681.0 100 L725.0 15.4 L769.0 100"/></svg><span>Requests</span></div></div>
  <div id="form">
    <h1>Ask for a feature, a channel or a fix</h1>
    <p class="lead">Tell us what would make Aurora better for you. Every request is read, and we'll build the ones that help the most people.</p>
    <form id="rq" novalidate>
      <div class="card"><label class="f" for="user">Your Aurora username</label><input class="txt" id="user" maxlength="60" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="The name you sign in with"></div>
      <div class="card"><label class="f">What kind of request is it?</label>
        <div class="kinds" role="radiogroup">
          <label><input type="radio" name="kind" value="feature" checked><span>A feature<small>Something new in the app</small></span></label>
          <label><input type="radio" name="kind" value="channel"><span>A channel or show<small>Something to add</small></span></label>
          <label><input type="radio" name="kind" value="problem"><span>A problem<small>Something not working</small></span></label>
          <label><input type="radio" name="kind" value="other"><span>Something else<small>Anything at all</small></span></label>
        </div></div>
      <div class="card">
        <label class="f" for="title">Short title <span class="cnt" id="tc">0 / 100</span></label><input class="txt" id="title" maxlength="100" placeholder="For example: Show the score on the channel list">
        <div style="height:14px"></div>
        <label class="f" for="details">Tell us more <span class="opt">(optional)</span> <span class="cnt" id="dc">0 / 1500</span></label><textarea id="details" maxlength="1500" placeholder="What would you like to see, and how would you use it? If it is a problem, which device and which channel or show?"></textarea>
        <div style="height:14px"></div>
        <label class="f" for="device">Your device <span class="opt">(optional)</span></label><input class="txt" id="device" maxlength="60" placeholder="Fire TV Stick, iPhone, Android TV, browser...">
      </div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" id="go" type="submit">Send my request</button>
      <div class="err" id="err" role="alert" hidden></div>
      <p class="hint">We read every request. We may reply to your account if we need more details.</p>
    </form>
  </div>
  <div id="thanks" class="done" hidden><div class="tick">&#10003;</div><h1>Thank you</h1><p class="lead">Your request was sent.</p><button class="btn line" id="again" type="button">Send another</button></div>
</div>
<script>
(function () {
  var G = ((window.AURORA_SITE || {}).guardUrl || '').replace(/\/+$/, ''), $ = function (i) { return document.getElementById(i); };
  function count() { $('tc').textContent = $('title').value.length + ' / 100'; $('dc').textContent = $('details').value.length + ' / 1500'; }
  $('title').addEventListener('input', count); $('details').addEventListener('input', count);
  $('again').onclick = function () { $('title').value = ''; $('details').value = ''; count(); $('thanks').hidden = true; $('form').hidden = false; $('go').disabled = false; $('go').textContent = 'Send my request'; window.scrollTo(0, 0); };
  $('rq').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('err'); err.hidden = true;
    var user = $('user').value.trim(), title = $('title').value.trim();
    if (!user) { err.hidden = false; err.textContent = 'Please enter your Aurora username.'; $('user').focus(); return; }
    if (title.length < 4) { err.hidden = false; err.textContent = 'Please give your request a short title.'; $('title').focus(); return; }
    if (!G) { err.hidden = false; err.textContent = 'Requests are not connected yet.'; return; }
    var b = $('go'); b.disabled = true; b.textContent = 'Sending...';
    var kind = document.querySelector('input[name="kind"]:checked').value;
    fetch(G + '/feature-request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: user, kind: kind, title: title, details: $('details').value, device: $('device').value, website: $('website').value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s === 200) { $('form').hidden = true; $('thanks').hidden = false; window.scrollTo(0, 0); return; }
        b.disabled = false; b.textContent = 'Send my request'; err.hidden = false; err.textContent = x.j.error || 'Could not send. Please try again.';
      }).catch(function () { b.disabled = false; b.textContent = 'Send my request'; err.hidden = false; err.textContent = 'Could not reach Aurora. Check your connection and try again.'; });
  });
})();
</script>
</body>
</html>
