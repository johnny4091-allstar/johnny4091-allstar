# Plain files: no build step. Netlify serves this folder as it is.
[build]
  publish = "."

# Aurora Lite, for older devices (Fire TV Stick 4K 1st gen and other Android 7 devices). Type aurora-streaming.org/lite in the Downloader app.
[[redirects]]
  from = "/lite"
  to = "https://github.com/johnny4091-allstar/johnny4091-allstar/releases/download/aurora-lite/Aurora-Lite.apk"
  status = 302
  force = true

# Aurora for Windows: the newest installer. The link never changes.
[[redirects]]
  from = "/windows"
  to = "https://github.com/johnny4091-allstar/johnny4091-allstar/releases/download/aurora-windows/Aurora-Setup.exe"
  status = 302
  force = true

# The web app (a copy of the aurora folder, made by tools/sync-web-app.js). Its service worker must never be served stale.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/app/"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/reseller/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/channels/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/requests/manage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/sabnzbd/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
