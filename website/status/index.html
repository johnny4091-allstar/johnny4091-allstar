<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aurora Status</title>
<meta name="theme-color" content="#070c1c">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script src="../config.js"></script>
<style>
@font-face { font-family:'Inter'; src:url('../assets/fonts/inter-variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
:root { --bg:#070c1c; --bg-2:#0e1530; --text:#fff; --muted:#b3b3b3; --dim:#808080; --line:#232f58; --green:#46d369; --amber:#ffd479; --red:#ff6b7f;
  --font:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--font); -webkit-font-smoothing:antialiased; background-image:radial-gradient(60% 30% at 8% 0%,rgba(42,212,208,.14),transparent 70%),radial-gradient(50% 30% at 100% 0%,rgba(122,92,255,.2),transparent 70%); background-repeat:no-repeat; }
.wrap { max-width:560px; margin:0 auto; padding:0 max(16px,env(safe-area-inset-left,0px)) 60px; }
.bar { padding:18px 0; } .bar a { color:#cfd6f5; text-decoration:none; font-weight:600; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; }
h1 { font-size:1.8rem; margin:8px 0 4px; font-weight:800; } .sub { color:var(--muted); margin:0 0 20px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
.row b { font-size:1.05rem; } .row small { display:block; color:var(--dim); font-size:.8rem; font-weight:400; }
.state { display:inline-flex; align-items:center; gap:8px; font-weight:700; } .dot { width:12px; height:12px; border-radius:50%; background:var(--dim); }
.ok .dot { background:var(--green); box-shadow:0 0 10px rgba(70,211,105,.6); } .ok { color:var(--green); }
.wait .dot { background:var(--amber); } .wait { color:var(--amber); }
.bad .dot { background:var(--red); } .bad { color:var(--red); }
.note { color:var(--dim); font-size:.82rem; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="../">&larr; Aurora</a></div>
  <h1>Aurora status</h1>
  <p class="sub" id="sum">Checking...</p>
  <div class="row"><div><b>Aurora Guard</b><small>Sign-in checks, limits and accounts</small></div><span class="state wait" id="g"><i class="dot"></i><span>Checking</span></span></div>
  <div class="row"><div><b>Aurora server</b><small>Movies, shows and streaming</small></div><span class="state wait" id="s"><i class="dot"></i><span>Checking</span></span></div>
  <p class="note" id="when"></p>
</div>
<script>
(function () {
  var G = ((window.AURORA_SITE || {}).guardUrl || '').replace(/\/+$/, ''), $ = function (i) { return document.getElementById(i); };
  function set(id, cls, text) { var e = $(id); e.className = 'state ' + cls; e.lastChild.textContent = text; }
  function check() {
    if (!G) { set('g', 'bad', 'Not set up'); set('s', 'wait', 'Unknown'); $('sum').textContent = 'The Guard address is not set in config.js.'; return; }
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 8000);
    fetch(G + '/status', { cache: 'no-store', signal: c.signal }).then(function (r) { return r.text(); }).then(function (txt) {
      clearTimeout(t);
      var guard = /Guard:\s*online/i.test(txt), a = (/Aurora:\s*([^\n\r]+)/i.exec(txt) || [])[1] || '', on = /^online/i.test(a.trim());
      set('g', guard ? 'ok' : 'bad', guard ? 'Online' : 'Offline');
      set('s', on ? 'ok' : (/checking/i.test(a) ? 'wait' : 'bad'), on ? 'Online' : (/checking/i.test(a) ? 'Checking' : 'Offline'));
      $('sum').textContent = guard && on ? 'Everything is working.' : guard ? 'The Aurora server is not answering right now.' : 'Something is wrong.';
    }).catch(function () {
      clearTimeout(t);
      set('g', 'bad', 'Not reachable'); set('s', 'wait', 'Unknown'); $('sum').textContent = 'We could not reach the Aurora Guard. It may be restarting.';
    }).then(function () { $('when').textContent = 'Checked ' + new Date().toLocaleTimeString() + '. This page refreshes by itself.'; });
  }
  check(); setInterval(check, 30000);
})();
</script>
</body>
</html>
