name: Build Aurora APK

on:
  push:
    paths:
      - 'aurora/**'
      - 'android/**'
      - '.github/workflows/aurora-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Aurora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-apk
          path: Aurora.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-v1.2.${{ github.run_number }}
          name: Aurora 1.2.${{ github.run_number }} for Android and Android TV
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Aurora.apk
          body: |
            Download **Aurora.apk** below on your Android phone, tablet or Android TV and open it to install.
            You may need to allow installing apps from your browser or file manager the first time.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.
