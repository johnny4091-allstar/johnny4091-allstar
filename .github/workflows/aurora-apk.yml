name: Build Aurora APK

on:
  push:
    paths:
      - 'aurora/**'
      - 'android/**'
      - '.github/workflows/aurora-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# GitHub is retiring Node 20 for actions; run them on Node 24 now so a problem shows up here first.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Offset keeps version codes above the EmbyFlix builds (1-4) so installed copies can update.
      # The release tag ends in the version code; the app compares it to its own to find updates.
      - name: Set version
        run: CODE=$((${{ github.run_number }} + 100))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.$((CODE / 50)).$((CODE % 50))" >> "$GITHUB_ENV"

      # The signing key lives only in GitHub secrets (Settings → Secrets and variables → Actions), never in the repo.
      # See android/SIGNING.md. Without them the build stops here, so nothing is ever signed with another key.
      - name: Prepare signing key
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          if [ -z "$AURORA_KEYSTORE_BASE64" ]; then missing="$missing AURORA_KEYSTORE_BASE64"; fi
          if [ -z "$AURORA_KEYSTORE_PASSWORD" ]; then missing="$missing AURORA_KEYSTORE_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions > Repository secrets (not Environment or Dependabot secrets), with exactly these names. See android/SIGNING.md."
            exit 1
          fi
          if ! printf '%s' "$AURORA_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/aurora-release.keystore"; then
            echo "::error::AURORA_KEYSTORE_BASE64 is not valid Base64. Paste the whole contents of KEYSTORE_BASE64.txt as one line."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/aurora-release.keystore" -storepass "$AURORA_KEYSTORE_PASSWORD" -alias aurora > /dev/null 2>&1; then
            echo "::error::The keystore would not open with AURORA_KEYSTORE_PASSWORD (or it has no key named aurora). Check that both secrets came from the same files."
            exit 1
          fi
          echo "Signing key is present and opens with the password."

      - name: Build APK
        working-directory: android
        env:
          AURORA_KEYSTORE_FILE: ${{ runner.temp }}/aurora-release.keystore
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: aurora
        run: gradle assembleRelease -PversionCode=${{ env.VERSION_CODE }} --stacktrace

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/aurora-release.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Aurora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-apk
          path: Aurora.apk

      # The app shows the lines between the notes markers in its update prompt.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # aurora/whats-new.md describes THIS update. If it is the same as the previous release's notes (someone forgot to
          # change it), the commit messages of this push are used instead, so one update never repeats the last one's notes.
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req, timeout=20))
          def lines(text):
              return [l.strip() for l in text.split('\n') if l.strip().startswith('- ')]
          mine = lines(open('aurora/whats-new.md').read())
          try:
              prev = get(f'https://api.github.com/repos/{repo}/releases/latest').get('body') or ''
              m = re.search(r'<!-- notes -->(.*?)<!-- /notes -->', prev, re.S)
              prev_lines = lines(m.group(1)) if m else []
          except Exception:
              prev_lines = []
          if not mine or mine == prev_lines:
              subjects = []
              before = os.environ.get('BEFORE', '')
              try:
                  commits = get(f'https://api.github.com/repos/{repo}/compare/{before}...{sha}')['commits'] if re.fullmatch(r'[0-9a-f]{40}', before) and set(before) != {'0'} else [get(f'https://api.github.com/repos/{repo}/commits/{sha}')]
                  for c in commits:
                      first = c['commit']['message'].split('\n')[0].strip()
                      if first and not first.startswith('Merge ') and first not in subjects: subjects.append(first)
              except Exception:
                  pass
              mine = ['- ' + t for t in subjects[:8]] or ['- Small behind-the-scenes improvements.']
              print('whats-new.md matched the previous release; using this push\'s commit messages instead')
          open('aurora/whats-new.release.md', 'w').write('\n'.join(mine) + '\n')
          PY
          {
            echo "## What's new"
            echo '<!-- notes -->'
            cat aurora/whats-new.release.md
            echo '<!-- /notes -->'
            echo
            echo 'Download **Aurora.apk** below on your Android phone, tablet or Android TV and open it to install.'
            echo 'You may need to allow installing apps from your browser or file manager the first time.'
            echo "Built from ${{ github.ref_name }} at ${{ github.sha }}."
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}
          name: Aurora V${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Aurora.apk
          body_path: release-notes.md
