name: Build Aurora APK

on:
  push:
    paths:
      - 'aurora/**'
      - 'android/**'
      - '.github/workflows/aurora-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Offset keeps version codes above the EmbyFlix builds (1-4) so installed copies can update.
      # The release tag ends in the version code; the app compares it to its own to find updates.
      - name: Set version
        run: echo "VERSION_CODE=$((${{ github.run_number }} + 100))" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ env.VERSION_CODE }} --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Aurora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-apk
          path: Aurora.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-v1.2.${{ env.VERSION_CODE }}
          name: Aurora 1.2.${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Aurora.apk
          body: |
            Download **Aurora.apk** below on your Android phone, tablet or Android TV and open it to install.
            You may need to allow installing apps from your browser or file manager the first time.
            Built from ${{ github.ref_name }} at ${{ github.sha }}.
